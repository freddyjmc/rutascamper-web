# Pruebas automáticas: en cada cambio y cada lunes (para detectar fuentes oficiales caídas o fichas caducadas).
name: Pruebas

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Datos y páginas
        run: npm run check
      - name: Fuentes oficiales (solo avisos)
        run: npm run check:external
